[project]
name = "crew_5_rag"
version = "0.1.0"
description = "Crew_5_rag using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,tools]==1.11.0",
    "crewai-tools>=0.38.0",
    "cohere>=5.0.0",
    "chromadb>=0.5.0",
    "streamlit>=1.35.0",
    "python-dotenv>=1.0.0",
    "selenium>=4.0.0",
    "webdriver-manager>=4.0.0",
    "litellm>=1.95.1",
    "langchain-groq>=1.1.3",
]

[project.scripts]
crew_5_rag = "crew_5_rag.main:run"
run_crew = "crew_5_rag.main:run"
train = "crew_5_rag.main:train"
replay = "crew_5_rag.main:replay"
test = "crew_5_rag.main:test"
run_with_trigger = "crew_5_rag.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[tool.uv]
override-dependencies = [
    "lancedb==0.30.0"
]
