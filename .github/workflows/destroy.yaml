name: Teardown Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm_action:
        description: "Type 'destroy' to confirm resource deletion and stop AWS billing"
        required: true
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm_action == 'destroy'
    defaults:
      run:
        working-directory: infra/app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        run: |
          terraform destroy -auto-approve \
            -var="groq_api_key=placeholder" \
            -var="serper_api_key=placeholder" \
            -var="cohere_api_key=placeholder"
